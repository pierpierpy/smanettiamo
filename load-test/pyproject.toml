[project]
name = "load-test"
version = "0.1.0"
description = "Load test of an LLM served by mlx_lm.server: TTFT, ITL and tokens per second with 1 to 16 users (aiperf results)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipykernel>=7.3,<8",
    "jupyterlab>=4.6,<5",
    "matplotlib>=3.11,<4",
    "mlx-lm>=0.32.2,<0.33",
    "pandas>=3.1.1,<4",
]

[tool.uv]
package = false
