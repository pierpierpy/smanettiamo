[project]
name = "llm-representation"
version = "0.1.0"
description = "How LLMs represent text and images (embeddings per layer, patches as tokens)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipykernel>=7.3,<8",
    "ipython>=9.17,<10",
    "ipywidgets>=8.1,<9",
    "jupyter-server-proxy>=4.6,<5",
    "jupyterlab>=4.6,<5",
    "matplotlib>=3.11,<4",
    "pillow>=12,<13",
    "torch>=2.6,<2.9",
    "torchvision>=0.21,<0.24",
    "transformers>=5.17,<6",
    "yt-webcam[opencv]",
]

[tool.uv]
package = false

[tool.uv.sources]
yt-webcam = { path = "../webcam", editable = true }
