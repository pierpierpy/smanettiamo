[project]
name = "yt-webcam"
version = "0.1.0"
description = "Generic webcam for the yt notebooks: a local server (DroidCam, MJPEG, OpenCV cameras) and a notebook client"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pillow>=12,<13",
]

[project.optional-dependencies]
opencv = ["opencv-python-headless>=4.10,<6"]   # for built-in / USB cameras (--device)

[project.scripts]
webcam = "webcam.cam:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webcam"]
